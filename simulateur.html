<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles-simulateur.css">
  <title>Simulateur de prix - Mon Bureau Tout Propre</title>
</head>

<body>

  <header>
    <div class="logo">
      <img src="img/logo.png" alt="Logo Mon Bureau Tout Propre" width="100">
      <h1>Simulateur de prix - Mon Bureau Tout Propre</h1>
    </div>

    <nav>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="tarifs.html">Tarifs</a></p>
        <li><a href="simulateur.html">Accéder au simulateur</a></p>
        </li>
      </ul>
    </nav>
  </header>
  <div class="container">
    <p>Choisissez combien de fois par semaine vous souhaitez chaque service :</p>

    <form class="container">
      <label for="surface">Surface des bureaux (m²) :</label>
      <input type="number" id="surface" name="surface" min="0" required>

      <label for="frequence">Fréquence du nettoyage :</label>
      <select id="frequence" name="frequence" required>
        <option value="">-- Sélectionnez --</option>
        <option value="1x_semaine">Une fois par semaine</option>
        <option value="2x_semaine">Deux fois par semaine</option>
        <option value="tous_les_jours">Tous les jours</option>
      </select>

      <label>Vitres incluses :</label>
      <div class="radio-group">
        <label><input type="radio" name="vitres" value="oui" required> Oui</label>
        <label><input type="radio" name="vitres" value="non"> Non</label>
      </div>

      <h2>Total HT : <span id="total">0</span> €</h2>
      <h2>TVA (20%) : <span id="tva">0</span> €</h2>
      <h2>Total TTC : <span id="totalTTC">0</span> €</h2>


      <button type="button" onclick="calculer()">Calculer le prix</button>
    </form>
  </div>
  <br>

  </form>
  <br>
  <footer>
    <p>&copy; 2025 Mon Bureau Tout Propre</p>
  </footer>

</body>

<script src="script.js"></script>

</html>
